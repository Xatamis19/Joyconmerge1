name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compila
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepara APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JoyconMerge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JoyconMerge
          path: JoyconMerge.apk

      - name: Pubblica nella Release "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest JoyconMerge.apk \
            --title "Joy-Con Merge (ultima build)" \
            --notes "Build automatica del commit ${GITHUB_SHA::7}. Scarica JoyconMerge.apk e installalo."
